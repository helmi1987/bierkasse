# Push to claude/** -> tests -> merge into main -> tag vX.Y.Z from VERSION (if new) and publish the
# GitHub release -> delete merged claude/** branches. The merge is a plain git push (no pull request);
# GITHUB_TOKEN may not push changes to .github/workflows, so such branches are merged via a pull request.
# Plesk deploys main via its Git webhook. dependabot-auto-merge.yml can push to main at the same time,
# so the push is retried on a fresh main.
name: Auto-merge Claude branches

on:
  push:
    branches: ['claude/**']

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  merge:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Merge branch into main
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin "$BRANCH"; then
            # An earlier run already merged and deleted the branch.
            git merge-base --is-ancestor "$GITHUB_SHA" HEAD && exit 0
            echo "Branch $BRANCH is gone and $GITHUB_SHA is not in main"; exit 1
          fi
          if [ "$(git rev-parse "origin/$BRANCH")" != "$GITHUB_SHA" ]; then
            echo "Branch $BRANCH moved on, the run for the newer commit merges it"; exit 0
          fi
          git fetch origin main
          if [ -n "$(git diff --name-only "origin/main...$GITHUB_SHA" -- .github/workflows)" ]; then
            echo "Changes .github/workflows: merging via a pull request"
            pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              url=$(gh pr create --head "$BRANCH" --base main --title "$(git log -1 --format=%s "$GITHUB_SHA")" \
                --body "Created by auto-merge.yml: the branch changes workflow files, which GITHUB_TOKEN may not push.")
              pr=${url##*/}
            fi
            gh pr merge "$pr" --merge --match-head-commit "$GITHUB_SHA"
            echo "Merged pull request #$pr into main"; exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset -q --hard origin/main
            if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
              echo "Already in main"; exit 0
            fi
            subject=$(git log -1 --format=%s "$GITHUB_SHA")
            git merge --no-ff --no-edit -m "Merge branch '$BRANCH' into main" -m "$subject" "$GITHUB_SHA"
            if git push origin HEAD:main; then
              echo "Merged $BRANCH into main"; exit 0
            fi
            echo "Push rejected (main changed), attempt $attempt"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Tag the release from VERSION
        run: |
          set -euo pipefail
          git fetch --tags --force origin main
          # Tag the first commit on main's first-parent line that contains the pushed commit (the merge
          # commit), even if main has moved on since.
          commit=$(git rev-list --first-parent --reverse --ancestry-path "$GITHUB_SHA..origin/main" | head -n1)
          [ -n "$commit" ] || commit=$(git rev-parse origin/main)
          version=$(git show "$commit:VERSION" | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION '$version' is not X.Y.Z, no tag"; exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists, nothing to do"; exit 0
          fi
          git tag -a "$tag" -m "$tag" "$commit"
          git push origin "refs/tags/$tag"
          echo "Tagged $commit as $tag"

      - name: Publish GitHub releases (new tag and any tag without a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          .github/scripts/publish-releases.sh

      - name: Delete merged claude/** branches
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*'
          git for-each-ref --format='%(refname:strip=3) %(objectname)' 'refs/remotes/origin/claude/' |
          while read -r branch sha; do
            if git merge-base --is-ancestor "$sha" origin/main; then
              # The lease keeps commits pushed after the fetch.
              git push origin --delete --force-with-lease="refs/heads/$branch:$sha" "$branch" ||
                echo "Kept $branch (changed or already gone)"
            fi
          done
